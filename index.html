<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clement & Fikile — Ndebele Wedding Invitation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ndebele-black: #0a0a0a;
    --ndebele-white: #ffffff;
    --ndebele-red: #d4213d;
    --ndebele-blue: #1a4b8c;
    --ndebele-yellow: #f5c518;
    --ndebele-green: #1a7a3a;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--ndebele-black);
    color: var(--ndebele-white);
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ===== GEOMETRIC BORDER FRAME ===== */
  .border-frame {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1000;
  }
  .border-frame::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 8px solid var(--ndebele-black);
  }
  .border-frame::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 6px solid var(--ndebele-yellow);
  }

  /* ===== TOP GEOMETRIC PANEL ===== */
  .top-panel {
    min-height: 35vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .top-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 50vw solid var(--ndebele-red);
    border-bottom: 35vh solid transparent;
    z-index: 1;
  }
  .top-panel::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-right: 50vw solid var(--ndebele-blue);
    border-bottom: 35vh solid transparent;
    z-index: 1;
  }

  /* Central diamond */
  .top-diamond {
    position: absolute;
    width: 120px; height: 120px;
    background: var(--ndebele-yellow);
    transform: rotate(45deg);
    z-index: 5;
    border: 4px solid var(--ndebele-black);
    top: 50%;
    left: 50%;
    margin-top: -60px;
    margin-left: -60px;
  }
  .top-diamond::before {
    content: '';
    position: absolute;
    inset: 12px;
    background: var(--ndebele-red);
    border: 3px solid var(--ndebele-black);
  }
  .top-diamond::after {
    content: '';
    position: absolute;
    inset: 24px;
    background: var(--ndebele-white);
    border: 2px solid var(--ndebele-black);
  }

  /* Zigzag strip */
  .zigzag-top {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30px;
    background: 
      linear-gradient(135deg, var(--ndebele-green) 25%, transparent 25%) -20px 0,
      linear-gradient(225deg, var(--ndebele-green) 25%, transparent 25%) -20px 0,
      linear-gradient(315deg, var(--ndebele-green) 25%, transparent 25%),
      linear-gradient(45deg, var(--ndebele-green) 25%, transparent 25%);
    background-size: 40px 30px;
    background-color: var(--ndebele-black);
    z-index: 10;
  }

  /* ===== STEPPED STRIP ===== */
  .stepped-strip {
    height: 40px;
    display: flex;
    width: 100%;
    z-index: 10;
  }
  .step-block {
    flex: 1;
    height: 100%;
    border: 2px solid var(--ndebele-black);
  }

  /* ===== CENTER SECTION ===== */
  .center-section {
    min-height: 40vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--ndebele-white);
    padding: 40px 20px;
    z-index: 10;
  }

  /* Name frame */
  .name-frame {
    position: relative;
    padding: 60px 80px;
    text-align: center;
  }
  .name-frame::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 6px solid var(--ndebele-black);
  }
  .name-frame::after {
    content: '';
    position: absolute;
    inset: 12px;
    border: 4px solid var(--ndebele-red);
  }

  /* Corner diamonds */
  .corner-diamond {
    position: absolute;
    width: 30px; height: 30px;
    background: var(--ndebele-yellow);
    border: 3px solid var(--ndebele-black);
    transform: rotate(45deg);
  }
  .corner-diamond.tl { top: -15px; left: -15px; }
  .corner-diamond.tr { top: -15px; right: -15px; }
  .corner-diamond.bl { bottom: -15px; left: -15px; }
  .corner-diamond.br { bottom: -15px; right: -15px; }

  /* Text styles */
  .prelude {
    font-size: 0.85rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--ndebele-black);
    margin-bottom: 15px;
    font-weight: 600;
  }
  .couple-names {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--ndebele-black);
    margin-bottom: 5px;
  }
  .ampersand {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 900;
    color: var(--ndebele-red);
    display: block;
    margin: 5px 0;
  }
  .wedding-date {
    font-size: 1.1rem;
    letter-spacing: 4px;
    color: var(--ndebele-blue);
    margin-top: 15px;
    font-weight: 600;
  }

  /* Geo divider */
  .geo-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
  }
  .geo-divider .line {
    width: 60px;
    height: 4px;
    background: var(--ndebele-black);
  }
  .geo-divider .diamond {
    width: 20px; height: 20px;
    background: var(--ndebele-yellow);
    border: 3px solid var(--ndebele-black);
    transform: rotate(45deg);
  }

  /* ===== DETAILS SECTION ===== */
  .details-section {
    background: var(--ndebele-white);
    padding: 40px 20px;
    position: relative;
    z-index: 10;
  }
  .details-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    max-width: 600px;
    margin: 0 auto;
  }
  .detail-card {
    text-align: center;
    padding: 30px 15px;
    border: 3px solid var(--ndebele-black);
    position: relative;
  }
  .detail-card:nth-child(1) { background: var(--ndebele-red); }
  .detail-card:nth-child(2) { background: var(--ndebele-blue); }
  .detail-card:nth-child(3) { background: var(--ndebele-green); }

  .detail-card .icon {
    font-size: 2rem;
    margin-bottom: 10px;
    display: block;
  }
  .detail-card .label {
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ndebele-white);
    opacity: 0.8;
    margin-bottom: 8px;
  }
  .detail-card .value {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ndebele-white);
    line-height: 1.4;
  }

  /* ===== BOTTOM PANEL ===== */
  .bottom-panel {
    min-height: 25vh;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
  }
  .bottom-panel::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 0;
    border-left: 50vw solid var(--ndebele-green);
    border-top: 25vh solid transparent;
    z-index: 1;
  }
  .bottom-panel::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 0; height: 0;
    border-right: 50vw solid var(--ndebele-yellow);
    border-top: 25vh solid transparent;
    z-index: 1;
  }

  .rsvp-area {
    position: relative;
    z-index: 10;
    text-align: center;
  }
  .rsvp-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--ndebele-black);
    margin-bottom: 15px;
  }
  .rsvp-btn {
    display: inline-block;
    padding: 15px 40px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--ndebele-white);
    background: var(--ndebele-black);
    border: 4px solid var(--ndebele-black);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
  }
  .rsvp-btn:hover {
    background: var(--ndebele-red);
    border-color: var(--ndebele-red);
    transform: translateY(-2px);
  }
  .rsvp-phone {
    font-size: 1rem;
    letter-spacing: 3px;
    color: var(--ndebele-black);
    margin-top: 15px;
    font-weight: 600;
  }

  /* ===== CHEVRON STRIP ===== */
  .chevron-strip {
    height: 25px;
    background: 
      linear-gradient(135deg, var(--ndebele-red) 33.33%, transparent 33.33%) 0 0,
      linear-gradient(225deg, var(--ndebele-red) 33.33%, transparent 33.33%) 0 0,
      linear-gradient(315deg, var(--ndebele-red) 33.33%, transparent 33.33%) 0 0,
      linear-gradient(45deg, var(--ndebele-red) 33.33%, transparent 33.33%) 0 0;
    background-size: 25px 25px;
    background-color: var(--ndebele-black);
    z-index: 10;
  }

  /* ===== MOTIF STRIP ===== */
  .geo-motif-strip {
    height: 20px;
    display: flex;
    width: 100%;
    z-index: 10;
  }
  .motif {
    flex: 1;
    height: 100%;
    border: 1px solid var(--ndebele-black);
  }

  /* ===== COUNTDOWN ===== */
  .countdown-section {
    background: var(--ndebele-black);
    padding: 40px 20px;
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .countdown-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--ndebele-yellow);
    margin-bottom: 25px;
    letter-spacing: 3px;
  }
  .countdown {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }
  .countdown-item {
    text-align: center;
  }
  .countdown-number {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 900;
    color: var(--ndebele-white);
    display: block;
    line-height: 1;
  }
  .countdown-label {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ndebele-yellow);
    margin-top: 5px;
  }

  /* ===== MUSIC TOGGLE ===== */
  .music-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px; height: 50px;
    border-radius: 0;
    background: var(--ndebele-yellow);
    border: 3px solid var(--ndebele-black);
    color: var(--ndebele-black);
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 2000;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(45deg);
  }
  .music-toggle span {
    transform: rotate(-45deg);
  }
  .music-toggle:hover {
    background: var(--ndebele-red);
    color: var(--ndebele-white);
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-on-scroll {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
  }
  .animate-on-scroll.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .name-frame { padding: 40px 30px; }
    .details-grid { grid-template-columns: 1fr; }
    .countdown { gap: 15px; }
    .countdown-number { font-size: 2rem; }
    .top-diamond { width: 80px; height: 80px; margin-top: -40px; margin-left: -40px; }
    .top-diamond::before { inset: 8px; }
    .top-diamond::after { inset: 16px; }
  }
</style>
</head>
<body>

<!-- Border Frame -->
<div class="border-frame"></div>

<!-- ===== TOP PANEL ===== -->
<div class="top-panel">
  <div class="top-diamond"></div>
  <div class="zigzag-top"></div>
</div>

<!-- Stepped Strip -->
<div class="stepped-strip">
  <div class="step-block" style="background: var(--ndebele-red);"></div>
  <div class="step-block" style="background: var(--ndebele-yellow);"></div>
  <div class="step-block" style="background: var(--ndebele-blue);"></div>
  <div class="step-block" style="background: var(--ndebele-green);"></div>

    <div class="prelude">We're getting married</div>
    <h1 class="couple-names">
      Clement
      <span class="ampersand">&</span>
      Fikile
    </h1>
    <div class="wedding-date">Sunday, 29 November 2026</div>
  </div>

  <div class="geo-divider">

</div>

<!-- Chevron Strip -->

<div class="details-section">
  <div class="details-grid animate-on-scroll">
    <div class="detail-card">
      <span class="icon">📅</span>
      <div class="label">Date</div>
      <div class="value">29 Nov 2026</div>
    </div>
    <div class="detail-card">
      <span class="icon">📍</span>
      <div class="label">Venue</div>
      <div class="value">4766 Johnny Mokua<br>Mohlakeng</div>
    </div>
    <div class="detail-card">
      <span class="icon">⏰</span>
      <div class="label">Time</div>
      <div class="value">[Time TBC]</div>
    </div>
  </div>
</div>

<!-- Motif Strip -->
<div class="geo-motif-strip">
  <div class="motif" style="background: var(--ndebele-red);"></div>
  <div class="motif" style="background: var(--ndebele-white);"></div>
  <div class="motif" style="background: var(--ndebele-blue);"></div>
  <div class="motif" style="background: var(--ndebele-white);"></div>
  <div class="motif" style="background: var(--ndebele-green);"></div>
  <div class="motif" style="background: var(--ndebele-white);"></div>
  <div class="motif" style="background: var(--ndebele-yellow);"></div>
  <div class="motif" style="background: var(--ndebele-white);"></div>
  <div class="motif" style="background: var(--ndebele-red);"></div>
  <div class="motif" style="background: var(--ndebele-white);"></div>
  <div class="motif" style="background: var(--ndebele-blue);"></div>
  <div class="motif" style="background: var(--ndebele-white);"></div>
  <div class="motif" style="background: var(--ndebele-green);"></div>
  <div class="motif" style="background: var(--ndebele-white);"></div>
  <div class="motif" style="background: var(--ndebele-yellow);"></div>

<!-- ===== COUNTDOWN ===== -->

      <span class="countdown-number" id="days">--</span>

    <a href="https://wa.me/27835225889?text=Hi%20Clement!%20I%27d%20love%20to%20attend%20your%20wedding%20on%2029%20Nov%20🙏" class="rsvp-btn">

<!-- Music Toggle -->

<!-- Audio -->
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
// Countdown
const weddingDate = new Date('2026-11-29T10:00:00+02:00');
function updateCountdown() {
  const now = new Date();
  const diff = weddingDate - now;
  if (diff <= 0) return;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const secs = Math.floor((diff % (1000 * 60)) / 1000);
  document.getElementById('days').textContent = days;
  document.getElementById('hours').textContent = hours;
  document.getElementById('mins').textContent = mins;
  document.getElementById('secs').textContent = secs;
}
setInterval(updateCountdown, 1000);
updateCountdown();

// Scroll animations
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.2 });
document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));

// Music
let isPlaying = false;
function toggleMusic() {
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');
  if (isPlaying) {
    audio.pause();
    btn.innerHTML = '<span>🎵</span>';
  } else {
    audio.play().catch(() => {});
    btn.innerHTML = '<span>🎶</span>';
  }
  isPlaying = !isPlaying;
}
</script>


<!DOCTYPE html>
<html><head><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Montserrat', sans-serif; background: #f8f3ec; color: #1a1a1a; width: 1080px; height: 1920px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 80px; }
body::before { content: ''; position: absolute; inset: 0; border: 12px solid #1a1a1a; }
body::after { content: ''; position: absolute; inset: 12px; border: 4px solid #6b2737; }
.diamond { position: absolute; width: 40px; height: 40px; background: #c49a2a; border: 3px solid #1a1a1a; transform: rotate(45deg); }
.diamond.tl { top: 20px; left: 20px; }
.diamond.tr { top: 20px; right: 20px; }
.diamond.bl { bottom: 20px; left: 20px; }
.diamond.br { bottom: 20px; right: 20px; }
.text { font-family: 'Cormorant Garamond', serif; font-size: 28px; text-align: center; line-height: 1.8; margin-bottom: 40px; }
.family { font-weight: 600; color: #6b2737; }
.honour { font-style: italic; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 3px solid #1a1a1a; }
.item { padding: 30px 20px; text-align: center; border-right: 1px solid #1a1a1a; }
.item:last-child { border-right: none; }
.item .icon { color: #6b2737; font-size: 24px; margin-bottom: 12px; }
.item .value { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; }
.item .label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #6b2737; margin-top: 8px; }
</style></head><body>
<div class="diamond tl"></div><div class="diamond tr"></div>
<div class="diamond bl"></div><div class="diamond br"></div>
<div class="text">
The <span class="family">Ledwaba</span> and <span class="family">Nkabinde</span> families
hereby invite you to share in the Umabo ceremony
<span class="honour">in honour of Simangaliso and Fikile</span>
</div>
<div class="grid">
<div class="item"><div class="icon">◆</div><div class="value">29 November 2026</div><div class="label">Date</div></div>
<div class="item"><div class="icon">◆</div><div class="value">12h00</div><div class="label">Time</div></div>
<div class="item"><div class="icon">◆</div><div class="value">4766 Johnny Mokua Street<br>Mohlakeng</div><div class="label">Venue</div></div>
</div>
</body></html>

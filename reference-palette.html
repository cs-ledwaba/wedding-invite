<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
.palette { display: flex; margin: 20px 0; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.color { width: 100px; height: 100px; margin: 5px; border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; color: white; font-size: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); padding-bottom: 5px; }
h2 { margin: 0 0 10px 0; }
p { margin: 5px 0; font-size: 12px; color: #666; }
</style>
</head>
<body>
<h1>Reference Video Color Palette</h1>
<p>Extracted from your video: nature-inspired, clean, elegant</p>

<div class="palette">
<div class="color" style="background: #90a080;">#90a080</div>
<div class="color" style="background: #90b080;">#90b080</div>
<div class="color" style="background: #f0f0f0; color: #333;">#f0f0f0</div>
<div class="color" style="background: #604030;">#604030</div>
<div class="color" style="background: #809070;">#809070</div>
<div class="color" style="background: #e0e0e0; color: #333;">#e0e0e0</div>
</div>

<p><strong>Mood:</strong> Natural, clean, elegant, earthy</p>

</body>
</html>
